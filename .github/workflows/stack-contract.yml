name: stack-contract

on:
  push:
  pull_request:

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose from .env.example
        run: docker compose --env-file .env.example config --format json
      - name: Verify the same CLI JSON contract
        run: scripts/homeflix --json verify contract
