# homeflix — self-hosted streaming stack
#
# Storage layout per ADR-0008 (.agent/decisions/): downloads and media share ONE
# filesystem under ${DATA_ROOT} so the *arr apps import by hardlink — instant, no extra
# disk, and torrents keep seeding. The *arr apps MUST mount the single root as /data;
# splitting it into separate torrents/ and media/ mounts silently breaks hardlinking.
#
# Copy .env.example to .env and fill it in before running.

networks:
  traefik-network:
    driver: bridge
    # Pinned so the VPN firewall allowlist stays valid. An unpinned bridge is reallocated
    # from Docker's pool on recreate, which would silently drop Traefik's access to the
    # services behind Gluetun.
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:?set PROXY_SUBNET to the Compose network CIDR — see .env.example}

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-UTC}

# Phase allowlists survive `docker compose config --format json`. Service-level
# x-homeflix.phase is the per-service source; Compose interpolation drops those
# fields, so the rendered contract reads this extension as well.
x-homeflix:
  phases:
    core:
      - traefik
      - jellyfin
      - jellyseerr
      - radarr
      - sonarr
    acquisition:
      - gluetun
      - qbittorrent
      - nzbget
      - prowlarr
      - lidarr
      - bazarr

services:
  # ============================================
  # Traefik — reverse proxy
  # ============================================
  traefik:
    image: traefik:${TRAEFIK_TAG:-v3.0}
    container_name: traefik
    x-homeflix:
      phase: core
    command:
      # ⚠️ OPEN DECISION: api.insecure exposes an unauthenticated dashboard on :8080.
      # Acceptable on a trusted LAN only. Must be hardened before any remote exposure.
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=${LOG_LEVEL:-info}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      # Docker provider service discovery. :ro on a unix socket does not restrict
      # the API — this is still root-equivalent. Traefik cannot discover containers
      # without it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_ROOT}/traefik:/traefik
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"

  # ============================================
  # Gluetun — VPN egress for the download/indexer services
  # ============================================
  # qBittorrent, NZBGet and Prowlarr share this container's network namespace, so they
  # have no IP of their own. Traefik's Docker provider therefore cannot discover them —
  # their routers are declared HERE, on gluetun, which is on traefik-network.
  # The *arr apps must reach them as gluetun:<port>, never localhost.
  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_TAG:-latest}
    container_name: gluetun
    x-homeflix:
      phase: acquisition
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "${QBITTORRENT_PORT:-6969}:${QBITTORRENT_PORT:-6969}/tcp"   # qBittorrent WebUI
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/tcp"           # torrent traffic
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp"
      - "${NZBGET_PORT:-6789}:${NZBGET_PORT:-6789}/tcp"
      - "${PROWLARR_PORT:-9696}:${PROWLARR_PORT:-9696}/tcp"
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_USER: ${VPN_USER}
      OPENVPN_PASSWORD: ${VPN_PASSWORD}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES}
      FIREWALL: "on"
      # Deliberately has no fallback: a default wide enough to suit every LAN also covers
      # the VPN provider's own gateway, which silently breaks NAT-PMP port forwarding.
      # The LAN and the proxy network are separate variables so neither has to be widened
      # to cover the other. See .env.example.
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:?set LAN_SUBNET to your LAN CIDR — see .env.example},${PROXY_SUBNET:?set PROXY_SUBNET to the Compose network CIDR — see .env.example}
      FIREWALL_INPUT_PORTS: ${TORRENT_PORT:-6881},${QBITTORRENT_PORT:-6969},${NZBGET_PORT:-6789},${PROWLARR_PORT:-9696}
      DNS_ADDRESS: ${VPN_DNS:-1.1.1.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_TARGET_ADDRESS: ${VPN_HEALTH_TARGET:-cloudflare.com:443}
    networks:
      - traefik-network
    restart: unless-stopped
    # No custom healthcheck: the gluetun image ships its own, which actually probes the
    # tunnel. (The inherited healthcheck hit :8888/v1/openvpn/status — wrong
    # port, wrong route, and the control server now requires auth by default.)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=${QBITTORRENT_PORT:-6969}"
      - "traefik.http.routers.nzbget.rule=Host(`nzbget.${DOMAIN}`)"
      - "traefik.http.routers.nzbget.service=nzbget"
      - "traefik.http.services.nzbget.loadbalancer.server.port=${NZBGET_PORT:-6789}"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=${PROWLARR_PORT:-9696}"

  # ============================================
  # Download clients + indexer manager (behind VPN)
  # ============================================
  # depends_on: { gluetun: { condition: service_healthy } } is honoured by
  # `docker compose up` only. The Docker daemon ignores it on
  # `restart: unless-stopped` after a host reboot, so a VPN'd service can start
  # against a Gluetun with no tunnel. Do not add a second supervisor for boot
  # order. deunhealth only restarts containers that have BOTH a Docker
  # healthcheck AND deunhealth.restart.on.unhealthy=true. Probe Gluetun's
  # namespace-sensitive health server on :9999, not the app WebUI or the :8888
  # control server.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG:-latest}
    container_name: qbittorrent
    x-homeflix:
      phase: acquisition
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
      WEBUI_PORT: ${QBITTORRENT_PORT:-6969}
      TORRENTING_PORT: ${TORRENT_PORT:-6881}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /data/torrents
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --connect-timeout 3 --max-time 5 http://127.0.0.1:9999/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - "deunhealth.restart.on.unhealthy=true"

  nzbget:
    image: lscr.io/linuxserver/nzbget:${NZBGET_TAG:-latest}
    container_name: nzbget
    x-homeflix:
      phase: acquisition
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/nzbget:/config
      - type: bind
        source: ${DATA_ROOT}/usenet
        target: /data/usenet
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --connect-timeout 3 --max-time 5 http://127.0.0.1:9999/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - "deunhealth.restart.on.unhealthy=true"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG:-latest}
    container_name: prowlarr
    x-homeflix:
      phase: acquisition
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --connect-timeout 3 --max-time 5 http://127.0.0.1:9999/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - "deunhealth.restart.on.unhealthy=true"

  # ============================================
  # The *arr apps — single /data root (hardlinks depend on this)
  # ============================================
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_TAG:-latest}
    container_name: radarr
    x-homeflix:
      phase: core
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - type: bind
        source: ${DATA_ROOT}
        target: /data
        bind:
          create_host_path: false
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG:-latest}
    container_name: sonarr
    x-homeflix:
      phase: core
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - type: bind
        source: ${DATA_ROOT}
        target: /data
        bind:
          create_host_path: false
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  lidarr:
    image: lscr.io/linuxserver/lidarr:${LIDARR_TAG:-latest}
    container_name: lidarr
    x-homeflix:
      phase: acquisition
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - type: bind
        source: ${DATA_ROOT}
        target: /data
        bind:
          create_host_path: false
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"

  # Bazarr writes subtitle files alongside the media, so this mount is NOT read-only.
  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_TAG:-latest}
    container_name: bazarr
    x-homeflix:
      phase: acquisition
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - type: bind
        source: ${DATA_ROOT}/media
        target: /data/media
        bind:
          create_host_path: false
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  # ============================================
  # Family-facing
  # ============================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_TAG:-latest}
    container_name: jellyfin
    x-homeflix:
      phase: core
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL:-http://jellyfin.${DOMAIN}}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${CACHE_ROOT}/jellyfin:/cache
      - type: bind
        source: ${DATA_ROOT}/media
        target: /data/media
        read_only: true
        bind:
          create_host_path: false
    # Hardware transcoding (Intel QuickSync): uncomment once verified on the host.
    # devices:
    #   - /dev/dri:/dev/dri
    networks:
      - traefik-network
    ports:
      - "8096:8096"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  jellyseerr:
    image: fallenbagel/jellyseerr:${JELLYSEERR_TAG:-latest}
    container_name: jellyseerr
    x-homeflix:
      phase: core
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${DOMAIN}`)"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"

  # ============================================
  # Monitoring & lifecycle
  # ============================================
  # Host CPU/mem/process via pid: host. No Docker socket: per-container stats
  # are not worth root-equivalent access on an HTTP UI. :ro on a socket would
  # not have restricted the API anyway.
  glances:
    image: nicolargo/glances:${GLANCES_TAG:-latest}
    container_name: glances
    pid: host
    environment:
      GLANCES_OPT: -w
    volumes:
      - ${CONFIG_ROOT}/glances:/config
    networks:
      - traefik-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glances.rule=Host(`glances.${DOMAIN}`)"
      - "traefik.http.services.glances.loadbalancer.server.port=61208"

  # Restarts containers that report unhealthy — notably the VPN'd services, which lose
  # networking if gluetun restarts.
  deunhealth:
    image: qmcgaw/deunhealth:${DEUNHEALTH_TAG:-latest}
    container_name: deunhealth
    network_mode: none
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    volumes:
      # Needs the API to inspect health and restart labeled containers.
      # :ro does not restrict writes. A socket proxy was considered and declined
      # — extra service + Traefik discovery risk for one write client.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ⚠️ OPEN DECISION: auto-updating :latest images unattended on a family-critical box
  # means a bad upstream image can break playback overnight. Alternative: pin the *_TAG
  # vars in .env and run Watchtower notify-only. See .agent/references/gotchas.md.
  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_TAG:-latest}
    container_name: watchtower
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_INCLUDE_RESTARTING: "false"
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 2 * * *}
      TZ: ${TZ:-UTC}
    volumes:
      # Pull/recreate updated images. :ro does not restrict the API. Service is
      # optional; auto-update of :latest on a family box is an open decision.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-network
    restart: unless-stopped
